<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-page">

<div class="login-wrapper">
    <div class="project-title">Hospi<span>TraX</span></div>

    <div class="form-box">
        <h2>Login</h2>

        <p id="error-msg" style="color:red; display:none;"></p>

        <form onsubmit="loginUser(event)">
            <input type="email" id="email" placeholder="Email" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>

        <a href="/register">Register</a>
    </div>
</div>

<script>
function loginUser(e) {
    e.preventDefault();

    const errorMsg = document.getElementById("error-msg");
    errorMsg.style.display = "none";

    const data = {
        email: document.getElementById("email").value,
        password: document.getElementById("password").value
    };

    fetch("/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
    })
    .then(res => res.json())
    .then(user => {
        if (user.error) {
            errorMsg.innerText = user.error;
            errorMsg.style.display = "block";
            return;
        }

        // Save to sessionStorage
        sessionStorage.setItem("userId", user.userId);
        sessionStorage.setItem("role", user.role);

        // FIX: Redirect with patientId in the URL as a backup
        // so patient-dashboard can read it even if sessionStorage
        // hasn't propagated yet across the page navigation
        if (user.role === "patient") {
            sessionStorage.setItem("patientId", user.patientId);
            window.location.href = "/patient?patientId=" + user.patientId;
        } else if (user.role === "doctor") {
            sessionStorage.setItem("doctorId", user.doctorId || "");
            window.location.href = "/doctor-dashboard";
        } else {
            window.location.href = "/admin";
        }
    })
    .catch(err => {
        errorMsg.innerText = "Something went wrong. Please try again.";
        errorMsg.style.display = "block";
        console.error(err);
    });
}
</script>

</body>
</html>
